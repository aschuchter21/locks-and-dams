<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Industrial control desk · Design review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#20272c;color:#e6edf0;font:15px system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}h1{font-size:23px;font-weight:500;margin:0 0 7px}p{margin:0;color:#aebdc5;line-height:1.5}.tag{color:#e8b842;font-size:12px;letter-spacing:.12em}nav{display:flex;align-items:end;gap:9px;flex-wrap:wrap;margin-top:22px}button,select{font:inherit;color:#e8eff2;background:#33424b;border:1px solid #637780;border-radius:5px;padding:9px 14px;cursor:pointer}button:hover,select:hover{background:#415662}button:focus-visible,select:focus-visible{outline:2px solid #e8b842;outline-offset:3px}label{display:flex;gap:8px;align-items:center}#stage{height:660px;width:100%;touch-action:none}canvas{display:block}footer{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;font-size:13px;color:#aebdc5}#status{color:#d2e0e5}@media(max-width:600px){main{padding:14px}#stage{height:420px}h1{font-size:20px}label{width:100%}}
</style></head><body><main><header><div><h1>Industrial control desk</h1><p>Three sections. Familiar controls. A new industrial finish.</p></div><span class="tag">DESIGN REVIEW · NOT YET IN THE MOD</span></header>
<nav aria-label="Model views"><button id="front">Front</button><button id="rear">Rear</button><button id="top">Control surface</button><button id="fit">Fit model</button><label>Indicator preview <select id="state"><option value="closed">Closed / idle</option><option value="moving">In motion</option><option value="open">Open</option><option value="stop">Emergency stop</option></select></label></nav>
<div id="stage" role="img" aria-label="Interactive control desk model. Drag to orbit, scroll to zoom, right-drag to pan."></div>
<footer><span id="status" aria-live="polite">Loading Blender model…</span><span>Drag to orbit · Scroll to zoom · Right-drag to pan</span></footer></main>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
import {GLTFLoader} from 'https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'https://esm.sh/three@0.170.0/examples/jsm/environments/RoomEnvironment.js';
const stage=document.getElementById('stage'),el=id=>document.getElementById(id),packed='__MODEL__';
try{
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x20272c);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;stage.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(36,1,.01,100),pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;
scene.add(new THREE.HemisphereLight(0xf3f5ff,0x71848b,.65));const light=new THREE.DirectionalLight(0xfff2dd,2);light.position.set(3,5,-3);scene.add(light);
const bytes=Uint8Array.from(atob(packed),c=>c.charCodeAt(0)),stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')),buffer=await new Response(stream).arrayBuffer();
const model=(await new GLTFLoader().parseAsync(buffer,'')).scene;scene.add(model);
let target=new THREE.Vector3(0,.45,0),radius=5.4,theta=2.6,phi=1.02,mode='closed';const lamps=[];
model.traverse(o=>{if(!o.isMesh)return;const m=o.material;if(['green','red','amber'].includes(m.name)&&(/Lamp|Lens|flashing_indicator/.test(o.name))){o.material=m.clone();lamps.push({mesh:o,color:m.color.clone(),kind:m.name,stop:/flashing_indicator/.test(o.name)});}});
function draw(time=0){const blink=Math.floor(time/500)%2===0;for(const l of lamps){const on=l.stop?mode==='stop'&&blink:l.kind==='green'?(mode==='closed'||mode==='stop'):l.kind==='red'?(mode==='open'||mode==='moving'):mode==='moving'&&blink;l.mesh.material.color.copy(l.color).multiplyScalar(on?1:.3);l.mesh.material.emissive.copy(l.color);l.mesh.material.emissiveIntensity=on?1.2:0;}camera.position.set(target.x+radius*Math.sin(phi)*Math.sin(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.cos(theta));camera.lookAt(target);renderer.render(scene,camera);}
function fit(){new THREE.Box3().setFromObject(model).getCenter(target);radius=5.4;theta=2.6;phi=1.02;draw();}
function resize(){renderer.setSize(stage.clientWidth,stage.clientHeight);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();draw();}new ResizeObserver(resize).observe(stage);
el('front').onclick=()=>{theta=Math.PI;phi=1.2;draw();};el('rear').onclick=()=>{theta=0;phi=1.15;draw();};el('top').onclick=()=>{theta=Math.PI;phi=.35;radius=4.6;draw();};el('fit').onclick=fit;
el('state').onchange=()=>{mode=el('state').value;el('status').textContent='Preview only · '+el('state').selectedOptions[0].text;draw();};
let down=null;stage.oncontextmenu=e=>e.preventDefault();stage.onpointerdown=e=>{down={x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey};stage.setPointerCapture(e.pointerId);};stage.onpointermove=e=>{if(!down)return;let dx=e.clientX-down.x,dy=e.clientY-down.y;down.x=e.clientX;down.y=e.clientY;if(down.pan){target.addScaledVector(new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0),-dx*radius*.0015);target.addScaledVector(new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1),dy*radius*.0015);}else{theta-=dx*.007;phi=Math.max(.04,Math.min(Math.PI-.04,phi+dy*.007));}draw();};stage.onpointerup=stage.onpointercancel=()=>down=null;
stage.addEventListener('wheel',e=>{e.preventDefault();radius=Math.max(1.2,Math.min(15,radius*Math.exp(e.deltaY*.001)));draw();},{passive:false});function animate(t){draw(t);requestAnimationFrame(animate);}fit();resize();requestAnimationFrame(animate);el('status').textContent='Blender model · Same control layout and three-block footprint';
}catch(error){el('status').textContent='Model could not load: '+error.message;console.error(error);}
</script></body></html>
