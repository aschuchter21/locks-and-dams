plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge' version '2.0.140'
}

group = mod_group
version = mod_version
base { archivesName = 'LocksAndDams-Forge-1.20.1' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
    }
    mods {
        locksanddams { sourceSet sourceSets.main }
    }
}

repositories { mavenCentral() }

tasks.named('processResources').configure {
    def replaceProperties = [mod_version: mod_version]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') { expand replaceProperties }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Test fixtures are opt-in and excluded from normal distribution builds.
if (project.hasProperty('lockChecks')) {
    sourceSets.main.java.srcDir 'tools/testsrc'
    legacyForge.runs.server {
        gameDirectory = project.file('run-checks')
        systemProperty 'locksanddams.checks', 'true'
        if (project.hasProperty('lockRestore')) systemProperty 'locksanddams.restore', 'true'
    }
}
if (project.hasProperty('lockPreview')) {
    sourceSets.main.java.srcDir 'tools/clienttest'
    legacyForge.runs.client {
        gameDirectory = project.file('run-preview')
        systemProperty 'locksanddams.preview', 'true'
        if (project.hasProperty('lockOverview')) systemProperty 'locksanddams.overview', 'true'
        programArgument '--quickPlaySingleplayer'
        programArgument 'Lock Prototype QA'
        programArgument '--width'
        programArgument '1280'
        programArgument '--height'
        programArgument '800'
    }
}
