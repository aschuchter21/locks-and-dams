plugins {
    id 'java'
    id 'net.neoforged.moddev.legacyforge' version '2.0.140'
}

group = mod_group
version = mod_version
base { archivesName = 'LocksAndDams-Forge-1.20.1' }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    runs {
        client {
            client()
            gameDirectory = project.file('run')
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
    }
    mods {
        locksanddams { sourceSet sourceSets.main }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/mirror' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
}
dependencies {
    modImplementation('com.simibubi.create:create-1.20.1:6.0.8-289:slim') { transitive = false }
    modImplementation('net.createmod.ponder:Ponder-Forge-1.20.1:1.0.91')
    modCompileOnly('dev.engine-room.flywheel:flywheel-forge-api-1.20.1:1.0.5')
    modRuntimeOnly('dev.engine-room.flywheel:flywheel-forge-1.20.1:1.0.5')
    modImplementation('com.tterrag.registrate:Registrate:MC1.20-1.3.3')
    implementation('io.github.llamalad7:mixinextras-forge:0.4.1')
}

tasks.named('processResources').configure {
    def replaceProperties = [mod_version: mod_version]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') { expand replaceProperties }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Test fixtures are opt-in and excluded from normal distribution builds.
if (project.hasProperty('createChecks')) {
    sourceSets.main.java.srcDir 'tools/createtest'
    legacyForge.runs.server {
        gameDirectory = project.file('run-create-checks')
        systemProperty 'locksanddams.createChecks', 'true'
        if (project.hasProperty('createRestore')) systemProperty 'locksanddams.createRestore', 'true'
    }
}
if (project.hasProperty('lockChecks')) {
    sourceSets.main.java.srcDir 'tools/testsrc'
    legacyForge.runs.server {
        gameDirectory = project.file('run-checks')
        systemProperty 'locksanddams.checks', 'true'
        if (project.hasProperty('lockRestore')) systemProperty 'locksanddams.restore', 'true'
    }
}
if (project.hasProperty('lockPreview')) {
    sourceSets.main.java.srcDir 'tools/clienttest'
    legacyForge.runs.client {
        gameDirectory = project.file('run-preview')
        systemProperty 'locksanddams.preview', 'true'
        if (project.hasProperty('lockOverview')) systemProperty 'locksanddams.overview', 'true'
        programArgument '--quickPlaySingleplayer'
        programArgument providers.gradleProperty('previewWorld').getOrElse('Create Lock QA')
        programArgument '--width'
        programArgument '1280'
        programArgument '--height'
        programArgument '800'
    }
}
